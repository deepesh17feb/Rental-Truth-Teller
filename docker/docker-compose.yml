version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# RentalTruth — Elasticsearch + Kibana + ELSER
# ─────────────────────────────────────────────────────────────────────────────
# ELSER requirements:
#   • ML node role must be enabled           → node.roles includes "ml"
#   • Minimum 4 GB JVM heap                  → ES_JAVA_OPTS=-Xms4g -Xmx4g
#   • xpack.ml.enabled=true                  → already implied by ml role
#   • At least Basic licence                 → self-generated basic is enough
#
# Host memory: allocate at least 8 GB to Docker for this stack.
#
# Start:   docker compose -f docker/docker-compose.yml up -d
# Stop:    docker compose -f docker/docker-compose.yml down
# Destroy: docker compose -f docker/docker-compose.yml down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Elasticsearch (ML-enabled for ELSER) ─────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: rentaltruth-es
    environment:
      - node.name=rentaltruth-es-node
      - cluster.name=rentaltruth-cluster
      - discovery.type=single-node

      # Node roles: master + data + ingest + ml
      # "ml" role is required to run ELSER inference locally.
      - node.roles=master,data,ingest,ml

      # Security
      - ELASTIC_PASSWORD=${ES_PASSWORD:-changeme}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false    # plain HTTP for local dev

      # Licence — basic is sufficient for ELSER v2
      - xpack.license.self_generated.type=basic

      # ML settings
      - xpack.ml.enabled=true
      # Allow ELSER model download from Elastic model registry
      - xpack.ml.model_repository=https://ml-models.elastic.co

      # Memory
      # ELSER v2 model is ~250 MB; the ML process needs headroom.
      # Increase to -Xms8g -Xmx8g for production or heavier workloads.
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - bootstrap.memory_lock=true

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - esdata:/usr/share/elasticsearch/data

    ports:
      - "9200:9200"
      - "9300:9300"

    healthcheck:
      test: >
        curl -fs -u elastic:${ES_PASSWORD:-changeme}
        "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
        || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s      # longer — ML node init takes more time

    networks:
      - rentaltruth-net

  # ── Kibana ────────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: rentaltruth-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ES_PASSWORD:-changeme}
      - XPACK_SECURITY_ENCRYPTIONKEY=rentaltruth_enc_key_32char_please
      - SERVER_NAME=rentaltruth-kibana
      # Enable ML UI so you can inspect ELSER model status in Kibana
      - XPACK_ML_ENABLED=true

    ports:
      - "5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: curl -fs http://localhost:5601/api/status || exit 1
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 90s

    networks:
      - rentaltruth-net

  # ── One-shot init container ───────────────────────────────────────────────────
  # Sets kibana_system password so Kibana can authenticate against ES.
  # Runs once, then exits.
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: rentaltruth-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_PASSWORD=${ES_PASSWORD:-changeme}
    entrypoint: >
      bash -c "
        echo 'Setting kibana_system password…';
        until curl -sf -u elastic:$$ES_PASSWORD
          -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
          -H 'Content-Type: application/json'
          -d '{\"password\":\"$$ES_PASSWORD\"}'
        ; do
          echo 'Retrying in 5s…'; sleep 5;
        done;
        echo 'kibana_system password set. Init complete.';
      "
    networks:
      - rentaltruth-net
    restart: "no"

# ── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  esdata:
    driver: local

networks:
  rentaltruth-net:
    driver: bridge
